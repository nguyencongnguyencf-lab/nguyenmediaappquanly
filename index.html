<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Hệ thống Quản lý Hàng hóa Offline-First hoàn chỉnh với IndexedDB, PWA Service Worker, và Supabase Sync 2 chiều" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>KhoOffline - Quản lý Hàng hóa Offline-First</title>
    <script>
      (function() {
        var APP_BUILD_VER = '20260806_v2_debt_fix';
        if (localStorage.getItem('kho_build_ver') !== APP_BUILD_VER) {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          localStorage.setItem('kho_build_ver', APP_BUILD_VER);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
